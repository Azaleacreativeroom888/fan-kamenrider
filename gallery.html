<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — 平成仮面ライダーファンサイト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Sans+JP:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0D0E1A;
      --surface: #141528;
      --border:  #22243a;
      --white:   #F2F0FF;
      --muted:   #7a7c9a;
      --kuuga:   #B22222;
      --agito:   #C0152A;
      --ryuki:   #990000;
      --faiz:    #C0A000;
      --blade:   #1a6bbf;
      --hibiki:  #d45f00;
      --kabuto:  #b8a000;
      --den-o:   #7B2FBE;
      --kiva:    #8B0000;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
    }

    .rider-bar {
      height: 4px;
      background: linear-gradient(90deg,
        var(--kuuga), var(--agito), var(--ryuki),
        var(--faiz), var(--blade), var(--hibiki),
        var(--kabuto), var(--den-o), var(--kiva), var(--kuuga)
      );
      background-size: 200% 100%;
      animation: barSlide 4s linear infinite;
    }
    @keyframes barSlide {
      0%   { background-position: 0% 0%; }
      100% { background-position: -200% 0%; }
    }

    nav {
      position: sticky;
      top: 0; z-index: 100;
      background: rgba(13,14,26,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1.5rem, 5vw, 3rem);
      height: 56px;
    }
    .nav-logo {
      font-family: 'Zen Dots', sans-serif;
      font-size: 1.05rem;
      color: var(--white);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .nav-logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      animation: dotCycle 9s steps(1) infinite;
      flex-shrink: 0;
    }
    @keyframes dotCycle {
      0%  { background: var(--kuuga);  }
      11% { background: var(--agito);  }
      22% { background: var(--ryuki);  }
      33% { background: var(--faiz);   }
      44% { background: var(--blade);  }
      55% { background: var(--hibiki); }
      66% { background: var(--kabuto); }
      77% { background: var(--den-o);  }
      88% { background: var(--kiva);   }
    }
    .nav-links { display: flex; gap: 1.8rem; list-style: none; }
    .nav-links a {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }

    .page-header {
      padding: 3.5rem clamp(1.5rem, 8vw, 6rem) 2.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .page-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      color: var(--blade);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .page-title {
      font-family: 'Zen Dots', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--white);
    }

    .tab-bar { display: flex; gap: 0; align-self: flex-end; }
    .tab-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--white); }
    .tab-btn.active { color: var(--white); border-bottom-color: var(--blade); }

    .gallery-section { padding: 3rem clamp(1.5rem, 8vw, 6rem) 5rem; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2px;
      background: var(--border);
    }
    .grid-panel { display: none; }
    .grid-panel.active { display: contents; }

    .gallery-item {
      position: relative;
      background: var(--surface);
      overflow: hidden;
      cursor: pointer;
    }
    .gallery-item::before { content: ''; display: block; padding-top: 133%; }
    .gallery-item img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item.placeholder { cursor: default; }
    .placeholder-inner {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    .ph-icon {
      font-family: 'Zen Dots', sans-serif;
      font-size: 1.8rem;
      color: var(--border);
    }
    .placeholder-inner span {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--border);
      text-transform: uppercase;
    }

    .item-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(13,14,26,0.88) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    .gallery-item:hover .item-overlay { opacity: 1; }
    .overlay-title { font-size: 0.82rem; color: var(--white); font-weight: 400; display: block; }
    .overlay-date {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      display: block;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.93);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 85vh; object-fit: contain; display: block; }
    .lightbox-close {
      position: fixed; top: 1.2rem; right: 1.5rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.15em;
      color: var(--muted); background: none; border: none;
      cursor: pointer; text-transform: uppercase; transition: color 0.2s;
    }
    .lightbox-close:hover { color: var(--white); }
    .lightbox-caption {
      position: fixed; bottom: 1.8rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.12em;
      color: var(--muted); white-space: nowrap;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem clamp(1.5rem, 8vw, 6rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .footer-logo { font-family: 'Zen Dots', sans-serif; font-size: 0.95rem; color: var(--muted); }
    footer p { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: #333; }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .page-header { flex-direction: column; align-items: flex-start; }
      footer { flex-direction: column; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="rider-bar"></div>

  <nav>
    <a class="nav-logo" href="index.html">
      <span class="nav-logo-dot"></span>
      HEISEI RIDER FAN
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div>
      <p class="page-eyebrow">作品一覧</p>
      <h1 class="page-title">Gallery</h1>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="manga">Manga</button>
      <button class="tab-btn" data-tab="illust">Illust</button>
    </div>
  </div>

  <div class="gallery-section">
    <div class="gallery-grid">

      <div class="grid-panel active" id="panel-all">
        <!-- 画像追加はこの形式で：
          <div class="gallery-item" onclick="openLightbox(this)"
               data-src="images/ファイル名.jpg" data-title="タイトル" data-date="2025-06-15">
            <img src="images/ファイル名.jpg" alt="タイトル" loading="lazy">
            <div class="item-overlay">
              <div><span class="overlay-title">タイトル</span><span class="overlay-date">2025-06-15</span></div>
            </div>
          </div>
        -->
        <div class="gallery-item placeholder" data-type="manga">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div>
        </div>
        <div class="gallery-item placeholder" data-type="manga">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div>
        </div>
        <div class="gallery-item placeholder" data-type="illust">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div>
        </div>
        <div class="gallery-item placeholder" data-type="illust">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div>
        </div>
        <div class="gallery-item placeholder" data-type="manga">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div>
        </div>
        <div class="gallery-item placeholder" data-type="illust">
          <div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div>
        </div>
      </div>

      <div class="grid-panel" id="panel-manga">
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div></div>
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div></div>
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Manga</span></div></div>
      </div>

      <div class="grid-panel" id="panel-illust">
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div></div>
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div></div>
        <div class="gallery-item placeholder"><div class="placeholder-inner"><span class="ph-icon">⬡</span><span>Illust</span></div></div>
      </div>

    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">Close ✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <footer>
    <div class="footer-logo">HEISEI RIDER FAN</div>
    <p>非公式ファンサイト / Unofficial Fan Site — ©︎ Azalea72</p>
  </footer>

  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.grid-panel');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function openLightbox(el) {
      const src = el.dataset.src;
      if (!src) return;
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-img').alt = el.dataset.title || '';
      document.getElementById('lightbox-caption').textContent =
        [el.dataset.title, el.dataset.date].filter(Boolean).join(' — ');
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(e) {
      if (e && e.target !== e.currentTarget && !e.target.classList.contains('lightbox-close')) return;
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightbox-img').src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>

</body>
</html>
